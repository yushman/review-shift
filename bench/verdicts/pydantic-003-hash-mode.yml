  reason: 'Read test_hashable_types at b095cd4a: it only asserts Model.model_json_schema()
    == json_schema and never calls hash(), so the claim is accurate and the fix commit
    220cd3d2 indeed shipped without adding a test. It also names the case''s defect
    explicitly (''hash(type(self.mode)) ... hashing type instead of value''), which
    is the subject matter the case is about, so I counted it as case_defect despite
    it being filed as a test gap.'
  recorded_at: '2026-08-20T08:07:07Z'
  adjudicated_by: model
