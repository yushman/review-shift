- finding_key: sha256:ff5287e92360815de678a4ed09bfc5181af4e170b7d9e94c5d0e56db7848903c
  true_defect: true
  case_defect: true
  reason: json_schema.py:2111-2112 is literally `return hash(type(self.mode))`; mode
    is a str literal or None, so all non-None modes hash to hash(str) and 'validation'/'serialization'
    collide, while the dataclass __eq__ compares the value. That is exactly the known
    defect (hash the mode value, not its type).
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:96725f00f900ed54f01eb7fae938ff01f56f6a09d5da444609a43539b420a467
  true_defect: true
  case_defect: true
  reason: json_schema.py:2112 `hash(type(self.mode))` - hash(str) for every non-None
    mode, so the two literal modes collide while __eq__ discriminates them; the hash/eq
    contract still holds, as stated. Same defect the later fix corrects.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:d3d829133b335d1f7e654ba5ed24a06b347ee58522a8442e6061f216ca732f0f
