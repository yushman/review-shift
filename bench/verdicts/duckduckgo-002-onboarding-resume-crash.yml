- finding_key: sha256:04fc5aa0b96978c21040c98cb12f4e258080a3575a9cd89d1d07b18834574e16
  true_defect: true
  case_defect: true
  reason: 'LaunchViewModel.kt:92-94 is the new `else -> throw IllegalArgumentException`
    on the new-user launch path. Contrary to the finding''s own hedge it is reachable:
    LinearOnboardingOrchestrator.startPlan is a no-op while a run is in progress,
    so a relaunch while the run sits on the BrowserActivity-hosted duckAiDemoStep
    (NewUserOnboardingPlanProvider.kt:600) yields host != OnboardingActivity and crashes
    - the same defect the fix (#9213, ''resuming into a browser-hosted step'') addresses.'
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
