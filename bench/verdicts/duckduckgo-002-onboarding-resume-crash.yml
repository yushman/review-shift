- finding_key: sha256:fe792e52002e59f32f986436369d1c02345d3652c3b6cdaa94f5acdcd2cb426f
  true_defect: true
  case_defect: false
  reason: 'Verified the asymmetry it cites: LaunchViewModel line 85 reads the toggle
    inline under viewModelScope (Main), while OnboardingViewModel.initializePages/onOnboardingDone/onOnboardingSkipped
    all wrap the same toggle in withContext/launch(dispatchers.io()); OnboardingBrandDesignUpdateToggles
    is a @ContributesRemoteFeature whose generated Toggle.Store is SharedPreferences-backed
    (see SSLCertificatesFeatureStore for the pattern), so the main-thread disk-read
    concern is grounded. Nothing to do with the else-throw crash the case fixes.'
  recorded_at: '2026-08-20T08:08:58Z'
  adjudicated_by: model
