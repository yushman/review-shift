- finding_key: sha256:242b6c9ab98a16940728645611c5c1e8c069d0a910d1680f005558a7933264d2
  true_defect: true
  case_defect: false
  reason: LaunchViewModel.kt:85 calls brandDesignUpdateToggles.brandDesignUpdate().isEnabled()
    directly on the viewModelScope (Main) coroutine, whereas the code it replaced
    wrapped the equivalent toggle read in `withContext(dispatcherProvider.io())` (NewUserOnboardingPlanBootstrapper.kt
    at the parent commit), and siblings like CtaViewModel.isBrandDesignUpdateEnabled
    and OnboardingViewModel.initializePages still do. The premise is factually right;
    unrelated to the throw defect.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:1b3f64e293198c2d15bb5b87c7f997bf50d94ddd54af670535ad904a467ccd3b
  true_defect: false
  case_defect: false
  reason: NewUserOnboardingPlanBootstrapper.kt:60's requireNotNull can only fire if
    startPlan lands on a non-InProgress state, but buildRootPlan always begins with
    introAnimationStep(), which has no precondition, so a run always has an eligible
    first step; the finding itself concedes it needs a misconfigured plan. Path not
    reachable in this commit.
