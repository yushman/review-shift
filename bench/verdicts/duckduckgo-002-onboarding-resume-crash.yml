- finding_key: sha256:32b9419582fd4aeab66523a31fcbddbcf918bf34b9b16cbc324828c4ea7b64a5
  true_defect: true
  case_defect: false
  reason: LaunchViewModel.kt:85 calls brandDesignUpdate().isEnabled() directly inside
    a viewModelScope (Main) coroutine; the generated @ContributesRemoteFeature store
    reads SharedPreferences and json-decodes on every get (see the KSP golden RemoteFeature_Basic.kt),
    and OnboardingViewModel:60/137 and the removed bootstrapper wrapper all dispatch
    to io(). Minor supporting-detail slips (lines 84/111 use launch(io) not withContext;
    isOnboardingImprovementsV2Enabled reads a different toggle method) do not affect
    the claim. Unrelated to the else->throw defect.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:d8423de2b02608f7d50491dbd80ba0eaff52a04351c38f751bdc17a5547e6afa
  true_defect: true
  case_defect: true
  reason: LaunchOrchestrator's contract (LinearOnboardingOrchestrator.kt:46-48) says
    startPlan 'does nothing while a run is already in progress', so LaunchViewModel.kt:86-87
    sees whatever step is current; NewUserOnboardingPlanProvider.kt:198 puts a BrowserActivity-hosted
    duckAiDemoStep in the root plan and BrandDesignUpdatePageViewModel.kt:448 handles
    that host. Relaunch while parked there hits the `else -> throw` at line 92-95.
    Exactly the known defect.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
