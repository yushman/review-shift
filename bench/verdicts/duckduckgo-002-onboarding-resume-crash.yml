  reason: Same else->throw at LaunchViewModel.kt:92-94. Reachable because startPlan
    does nothing while a run is in progress, so on relaunch currentStep can be the
    BrowserActivity-hosted duckAiDemoStep; matches the known crash-on-resume defect.
  recorded_at: '2026-08-26T17:54:52Z'
