schema_version: 1
case_id: cli-001-worktree-dash-path
verdicts:
- finding_key: sha256:2f8345477a82349a7486972c1fc952ff96c12f483de426150002d15afeadd34e
  true_defect: false
  case_defect: false
  reason: 'The claimed breakage does not follow: git accepts global options in any
    order, and I verified `git -c credential.helper= -C sub rev-parse` works, so credential
    flags prepended ahead of a `-C` would not break a submodule invocation; additionally
    no submodule command in this file is ever built with a -C prefix, so the concern
    is doubly hypothetical.'
  recorded_at: '2026-08-20T07:56:41Z'
  adjudicated_by: model
- finding_key: sha256:7f9ff2fecbfa3f54aebf75d00d3e2d94f0ed659e11585314271f6da2b2fd5b95
  true_defect: true
  case_defect: false
  reason: 'Verified in checkout.go at b130a9be: the worktree-reuse branch of cmdsForMissingRemote
    emits `checkout -B <localBranch> FETCH_HEAD` with no opts.Force gate, while syncBranchCmds/worktreeCheckoutCmds
    and the fresh-worktree fetch path all gate a destructive reset behind --force
    (whose help text is ''Reset the existing local branch...''), so an existing branch
    is force-moved without --force. The case bug is the missing `--` separator before
    worktree paths in `worktree add`, which this finding never mentions.'
  recorded_at: '2026-08-20T07:56:41Z'
  adjudicated_by: model
- finding_key: sha256:3d28381b84c6fe6aa87a71ab2c00094925b915545882ef87667868831a223767
  true_defect: true
  case_defect: false
  reason: 'Same accurate claim as the other checkout -B finding: `-B` resets an existing
    branch ref to FETCH_HEAD unconditionally in the isWorktreeAtPath branch of cmdsForMissingRemote,
    unlike every other sync path which uses merge --ff-only unless opts.Force. Unrelated
    to the case''s `--` end-of-options fix in the four `worktree add` call sites (fix
    5e6aa5ab).'
  recorded_at: '2026-08-20T07:56:41Z'
  adjudicated_by: model
- finding_key: sha256:70aa9d93fb64caf9636c434333ef4d51c137da9010d21f6c62f1f206f2bfe45c
  true_defect: true
  case_defect: false
  reason: The claim (unconditional `checkout -B` in the reused-worktree fork-PR path
    bypasses the --force gate used everywhere else in the file) matches the code at
    b130a9be; note its proposed patch would break the branch-does-not-exist case,
    but the defect described is real. Nothing to do with the case's missing `--` before
    worktree paths.
  recorded_at: '2026-08-20T07:56:41Z'
  adjudicated_by: model
- finding_key: sha256:6bac854d57739a2f1f0d2dab1811db6dc3c67b3e455cf78af3e4c17dfad4d99a
  true_defect: true
  case_defect: false
  reason: checkout.go:277 in cmdsForMissingRemote runs `-C <wt> checkout -B <localBranch>
    FETCH_HEAD` with no reference to opts.Force, while every sibling sync path goes
    through syncBranchCmds (line 358-366) which only hard-resets under --force and
    otherwise uses merge --ff-only; -B force-moves the branch ref, so local commits
    are dropped without --force. Unrelated to the missing `--` separator in the note.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:dc7e76faa0e37492886e9d65911bf313fc90fc12792ed57d40f2b8b67c989984
  true_defect: true
  case_defect: false
  reason: 'Verified checkout.go:277: `checkout -B <branch> FETCH_HEAD` ignores opts.Force,
    unlike syncBranchCmds used by every other sync path; -B resets the branch ref,
    discarding local commits without --force. Known defect here is the missing `--`
    before the worktree path, which this does not touch.'
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:8af1b1ff9745278827fa44831ee4f67cdad5e2656360085520069578c93a51a3
  true_defect: true
  case_defect: false
  reason: Same verified claim as F006/F010 about checkout.go:277 - unconditional `checkout
    -B` bypasses the opts.Force gate that syncBranchCmds/worktreeCheckoutCmds apply
    everywhere else. Unrelated to the `--` separator defect.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:b01495df276639c75b32f88999280f30bbd1652de25b799a3298c0cf2d32f642
  true_defect: false
  case_defect: false
  reason: checkout.go:220 -> worktreeCheckoutCmds emits `-C <wt> checkout <branch>`
    right after `git fetch <remote> +refs/heads/X:refs/remotes/<remote>/X`. Git's
    default DWIM (checkout.guess) creates the local branch from the single matching
    remote-tracking ref, so the claimed 'pathspec did not match any file(s)' failure
    does not occur in the described scenario.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:8bd42f4530b63e3bcd449e434d1c85280e7fbbb494c47e1586a7f22fb4b18165
  true_defect: false
  case_defect: false
  reason: Same claim as F015 about checkout.go:220/worktreeCheckoutCmds. The bare
    `checkout <branch>` follows a fetch that writes refs/remotes/<remote>/<branch>,
    and git's default DWIM turns that into `checkout -b <branch> --track <remote>/<branch>`,
    so the described failure does not happen.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:6edec3c39768eb6330f068181463eebe66b02a2a79cc0753151ec3949cb5200d
  true_defect: true
  case_defect: true
  reason: checkout.go:250 is `{"worktree","add","--detach",opts.Worktree,"FETCH_HEAD"}`
    with no `--` before the user-supplied path, so a dash-leading --worktree value
    is parsed as an option. Exactly one of the five call sites the fix commit patched.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:0b3f723691c6141222dc8823db5e078ccc5d4d6aa904596304f9c3c4fdd74e3b
  true_defect: true
  case_defect: true
  reason: Points one line above checkout.go:225, `{"worktree","add","--track","-b",localBranch,opts.Worktree,remoteBranch}`,
    which passes the user path positionally with no `--`; that is one of the call
    sites in known_defect_location and the same dash-path misparse.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:0b4370009a22b2890e1b68dae2daebe25965fcebf14921ad4e17f6073be3c939
  true_defect: true
  case_defect: true
  reason: checkout.go:284 is `{"worktree","add",opts.Worktree,localBranch}` with no
    end-of-options `--`; a dash-leading path is parsed as an option. One of the exact
    lines the fix commit touched.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:b13d8a39ceed1998b1be9e859f0adb0088f79d854ea41470761d4eb549280f8f
  true_defect: true
  case_defect: true
  reason: Describes checkout.go:225 (`worktree add --track -b <branch> <path> <remoteBranch>`)
    - the path follows `-b localBranch` positionally with no `--`; line pointer is
    two lines off but the mechanism and call site are one of the five in the known
    fix.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:47e8db0abd52376fb5548fef467d48e16f4dd836db69e798f7f2f503c15668a1
  true_defect: true
  case_defect: true
  reason: Quotes `worktree add --detach opts.Worktree FETCH_HEAD`, i.e. checkout.go:214,
    and correctly names the other four call sites (224/227/250/284); a dash-leading
    --worktree path is parsed as an option by git worktree add. Same defect as the
    fix.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:1cbd697762f6452638e05d0e34091528383cb770fb7145274373710da76eb3f8
  true_defect: true
  case_defect: true
  reason: checkout.go lines 214, 222, 225, 250, 284 all pass opts.Worktree as a bare
    positional to `git worktree add` with no `--`; the only validation (line 65) rejects
    blank, and the dash guard at line 140 covers pr.HeadRefName, not Worktree. This
    is the known defect.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:faa72c62e34664c37ef2abbf8b83c425b0029690cdbff3382053740be5a56325
  true_defect: true
  case_defect: false
  reason: checkout.go:162-165 queues `submodule sync/update` with no -C prefix, and
    git/client.go:77-80 only prepends -C when RepoDir is set, which pkg/cmd/factory/default.go:240-249
    never does for pr checkout (grep shows RepoDir assigned only in clone/create/fork/extension/skills).
    So with --worktree the submodule commands run in the invoking repo, not the new
    worktree. Unrelated to the missing `--`.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:f15dbc28588544b4f3c8ab108d066ecad064cbfe987d98e76c1f2dc260da5828
  true_defect: true
  case_defect: false
  reason: checkout.go:273-277 queues `checkout -B <localBranch> FETCH_HEAD` with no
    reference to opts.Force, while syncBranchCmds (353-362) used at 223/229/289 only
    hard-resets under --force; the test at checkout_test.go:488-514 does register
    `git -C /path/to/wt checkout -B feature FETCH_HEAD`. Real inconsistency, but not
    the missing-`--` defect.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:64d1d5c496b166d3d92b040751e9af0f42a94b3bcc2bff6fe651e7aa8b70c501
  true_defect: true
  case_defect: false
  reason: isWorktreeAtPath (checkout.go:330-348) only scans `worktree ` prefixes from
    `git worktree list --porcelain` and ignores prunable annotations, so an rm -rf'd
    but unpruned worktree still returns true and routing goes to the `git -C <missing
    path> ...` reuse branch. Real, low-impact, and unrelated to the missing `--`.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:98d6985f62cf8c20ced3650caab1e37e18453bc8a42bce2b7c2ecb2ed8697248
  true_defect: true
  case_defect: false
  reason: checkout.go:220 routes worktree reuse through worktreeCheckoutCmds, whose
    bare `checkout <branch>` (line 367) relies on DWIM against refs/remotes/<remote>/<pr.HeadRefName>;
    with --branch a custom localBranch (194-196) has neither a local branch nor a
    matching remote-tracking ref, so the checkout fails. The sibling branches at 222/225
    avoid this, and checkout_test.go:517 only covers a custom name with a fresh worktree.
    Unrelated to the missing `--`.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:c16008cffc096c9527e779cbb76b37a27585ed43b2c9cc21d27af4a5eeeed364
  true_defect: true
  case_defect: true
  reason: Anchored at the flag declaration (line 106) but names the mechanism exactly
    and enumerates lines 214, 222, 225, 250, 284 -- the complete ground-truth set
    -- and contrasts it with the existing HasPrefix(pr.HeadRefName, "-") guard at
    line 140.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:c046c116387b595b553c57532a3ebfe76f1b855b029bcca205faee574e64e84f
  true_defect: true
  case_defect: false
  reason: 'checkout.go:279-284: the new-worktree fork path fetches `refs/pull/N/head:<localBranch>`,
    which git refuses when localBranch is checked out anywhere (''refusing to fetch
    into branch ... checked out at''), and --force does not lift that check. The sibling
    branch at line 286 exists precisely to avoid this for the current branch but the
    worktree case bypasses it. Real, distinct from the `--` separator defect.'
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:5e1c1bde94be3379515c0ee89db0a9dabbf747b97eced6293f35bceed482acee
  true_defect: false
  case_defect: false
  reason: The claim rests on `git -C <wt> checkout <branch>` failing when the branch
    has no local ref, but git's default checkout.guess DWIM creates a local tracking
    branch when exactly one refs/remotes/*/<branch> exists -- and the fetch at line
    209 has just created refs/remotes/<remote>/<branch>. The described 'pathspec did
    not match' failure does not occur in the standard configuration.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:2cdb9d4480b83a74fb45cb5bb2de739798ca5f57fcff84d883af11a4b88b0190
  true_defect: false
  case_defect: false
  reason: checkout.go:221-223 does fail when the branch is already checked out elsewhere,
    but git fundamentally cannot check out one branch in two worktrees, so failing
    is correct behavior and git emits its own explanatory 'already used by worktree
    at' message. The finding proposes an outcome ('succeeding') that is impossible;
    this reduces to error-message polish.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:fbd7e8f37f375fcf66b88254c77740c04d518f590ba6da316ab52b1eafdd2342
  true_defect: false
  case_defect: false
  reason: A placement/abstraction preference about isWorktreeAtPath (checkout.go:329-348)
    living outside git.Client. No input or state makes the code behave wrongly.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:0f1061913d301fa2df347d41b64f6933154a5c5d59f1bad6968a213ae2f09aed
  true_defect: true
  case_defect: false
  reason: 'Same real defect as F017 at checkout.go:277: `checkout -B` ignores opts.Force
    and can discard local commits where syncBranchCmds would have used merge --ff-only.
    Corroborated by the added test ''checkout fork PR without a remote into the same
    worktree again'' stubbing `checkout -B feature FETCH_HEAD` with Force unset. Not
    the `--` separator ground truth.'
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:6056f5c5376462e833ec4914dc6de1f8266013ca345897e75216e99e5f55a17c
  true_defect: false
  case_defect: false
  reason: 'Same mistaken premise as F024: worktreeCheckoutCmds'' plain `git -C <path>
    checkout <branch>` resolves via git''s default DWIM against the refs/remotes/<remote>/<branch>
    just created by the fetch at line 209, so it does not fail when the local branch
    is absent.'
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:c8d8e276312de7ec7047871befcffaeee55b761be6f226b77adece4ca09fef0a
  true_defect: true
  case_defect: false
  reason: isWorktreeAtPath (checkout.go:330-348) parses only the `worktree <path>`
    lines of `git worktree list --porcelain` and ignores prunable/stale entries, and
    nothing in the diff prunes. After an `rm -rf` of the worktree directory git still
    lists it, so checkoutRun takes the reuse branch and runs `git -C <missing dir>
    fetch/checkout`. Real, but unrelated to the `--` separator ground truth.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:f97cafeb33654627cf3f6b1fdb181e8bfa79c0b28548cc3becf01d98b2fc55a3
  true_defect: true
  case_defect: false
  reason: checkout.go:162-165 appends `submodule sync/update` with no `-C opts.Worktree`,
    and executeCmds runs them in the client's repo dir, so `--worktree` combined with
    `--recurse-submodules` updates the original checkout's submodules and leaves the
    new worktree's uninitialized, with no error. Real, distinct from the `--` separator
    ground truth.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
