  reason: Reproduced `secrets.compare_digest('пароль','пароль')` raising TypeError
    locally, and the line quoted is exactly the one fix 35b8d94c rewrites to encode
    both operands to bytes; same defect, same mechanism (the fix uses errors='surrogatepass'
    where this patch uses plain utf-8, which does not change the verdict).
  recorded_at: '2026-08-20T08:05:46Z'
  adjudicated_by: model
- finding_key: sha256:70c5b4af0a0e79716f95d48c9f8736e33814b7b05c49919532a4afe70acb9a7f
  true_defect: false
  case_defect: false
  reason: 'The asymmetry does not exist: CPython''s do_richcompare tries the right
    operand''s reflected __eq__ first whenever its type is a proper subtype, so with
    an inherited `isinstance(other, self.__class__)` check both `base == sub` and
    `sub == base` evaluate the subclass''s method and return False. Verified on Python
    3.9 and 3.12 with a minimal reproduction.'
  recorded_at: '2026-08-20T08:05:46Z'
  adjudicated_by: model
- finding_key: sha256:e59297a67c6e54c6716e42c2a5cda802a7c793a7f818e4e49039c43fc858022c
  true_defect: false
  case_defect: false
  reason: 'Same claim as the SecretBytes variant and equally wrong: the reproduction
    on 3.9 and 3.12 shows `base == subclass_instance` returns False, not True, because
    the subclass''s reflected __eq__ is invoked first, so equality stays symmetric.
    Also unrelated to the case''s compare_digest/non-ASCII TypeError.'
  recorded_at: '2026-08-20T08:05:46Z'
  adjudicated_by: model
