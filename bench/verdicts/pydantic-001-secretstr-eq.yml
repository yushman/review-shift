- finding_key: sha256:48b8bf4394c34645ef4ea81e73a5d989039d61a4b403b49938dee48c2f637a03
  true_defect: true
  case_defect: false
  reason: 'Verified types.py:1931-1935 at d0ffa095: SecretBytes.__eq__ uses isinstance(other,
    self.__class__). For `class Sub(SecretBytes): pass` (no __eq__ override, so Python''s
    subclass-reflection priority does not apply), SecretBytes(b''x'')==Sub(b''x'')
    is True while Sub(b''x'')==SecretBytes(b''x'') is False -- an asymmetric __eq__
    with equal hashes. Real, but not the compare_digest/non-ASCII TypeError ground
    truth.'
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:67daf69596b1b577ef756276449c9dbd288522ea80fbc970ead9c01f5f0a7f05
  true_defect: true
  case_defect: true
  reason: types.py:1891 passes raw str to secrets.compare_digest, which raises TypeError
    for non-ASCII str; SecretStr wraps arbitrary user text with no ASCII constraint.
    This is precisely the defect the upstream fix (#13537) addresses.
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
- finding_key: sha256:e2f9a3ca8eea6fdf41ef18381e2d278b4aebbb8f55b9955b7c2c1cb6c52f2a04
  true_defect: true
  case_defect: false
  reason: 'types.py:1888 isinstance(other, self.__class__): the SecretStr docstring
    documents subclassing (custom _display), and a plain subclass yields SecretStr(''x'')==Sub(''x'')
    True but Sub(''x'')==SecretStr(''x'') False. Real symmetry violation, but a different
    bug from the compare_digest non-ASCII crash.'
  recorded_at: '2026-09-02T11:58:45Z'
  adjudicated_by: model
