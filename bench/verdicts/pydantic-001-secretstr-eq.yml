- finding_key: sha256:b516a3e3f4b4748091130c1d86e6823651aa46621e2f31f83e097ae2834db025
  true_defect: true
  case_defect: true
  reason: Reproduced `secrets.compare_digest('пароль','пароль')` raising TypeError
    locally, and the line quoted is exactly the one fix 35b8d94c rewrites to encode
    both operands to bytes; same defect, same mechanism (the fix uses errors='surrogatepass'
    where this patch uses plain utf-8, which does not change the verdict).
  recorded_at: '2026-08-20T08:05:46Z'
  adjudicated_by: model
- finding_key: sha256:70c5b4af0a0e79716f95d48c9f8736e33814b7b05c49919532a4afe70acb9a7f
  true_defect: false
  case_defect: false
  reason: 'The asymmetry does not exist: CPython''s do_richcompare tries the right
    operand''s reflected __eq__ first whenever its type is a proper subtype, so with
    an inherited `isinstance(other, self.__class__)` check both `base == sub` and
    `sub == base` evaluate the subclass''s method and return False. Verified on Python
    3.9 and 3.12 with a minimal reproduction.'
  recorded_at: '2026-08-20T08:05:46Z'
  adjudicated_by: model
- finding_key: sha256:e59297a67c6e54c6716e42c2a5cda802a7c793a7f818e4e49039c43fc858022c
  true_defect: false
  case_defect: false
  reason: 'Same claim as the SecretBytes variant and equally wrong: the reproduction
    on 3.9 and 3.12 shows `base == subclass_instance` returns False, not True, because
    the subclass''s reflected __eq__ is invoked first, so equality stays symmetric.
    Also unrelated to the case''s compare_digest/non-ASCII TypeError.'
  recorded_at: '2026-08-20T08:05:46Z'
  adjudicated_by: model
- finding_key: sha256:1d2dec51b88043df2911737e8d060fd36d2c45c6482b956b6e61a26c98175c94
  true_defect: true
  case_defect: false
  reason: types.py:1928-1935 (SecretBytes) is byte-for-byte identical to 1884-1891
    (SecretStr), both bodies only call get_secret_value(), and both classes derive
    from _SecretField, so the hoist is valid - the duplication claim is accurate.
    It is not the compare_digest non-ASCII TypeError defect.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:af35e86afe5ef984254c49da646fc09312db57c9e005392396f2a04848853527
  true_defect: true
  case_defect: true
  reason: types.py:1887-1891 - SecretStr.__eq__ calls secrets.compare_digest on two
    str values; verified locally that compare_digest('café','café') raises TypeError('comparing
    strings with non-ASCII characters is not supported') while the bytes form succeeds.
    Exactly the known defect (#13537).
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:3317a808ac99a7ae11895af8a2aafcefc257946181bb50be03b0328ec000350f
  true_defect: true
  case_defect: true
  reason: Confirmed at types.py:1891 and by running secrets.compare_digest on non-ASCII
    str (TypeError) vs bytes (ok); SecretStr.get_secret_value() returns str, so ==
    on non-ASCII secrets raises instead of returning bool, and SecretBytes at 1931-1935
    is indeed unaffected. The known defect.
  recorded_at: '2026-08-26T17:54:52Z'
  adjudicated_by: model
- finding_key: sha256:23c5c6d84096582737d6240e94e563757d2876cd2307f885c3d94ed908989f4d
  true_defect: true
  case_defect: true
  reason: types.py:1887-1891 at that sha uses secrets.compare_digest(str,str); verified
    locally that it raises TypeError on non-ASCII str. main.py:1249 does `self.__dict__
    == other.__dict__`, so the BaseModel path is real too. This is exactly the known
    defect.
  recorded_at: '2026-08-26T19:24:35Z'
  adjudicated_by: model
- finding_key: sha256:1982df7e8793f40f739810ce4287038ad705fe87550ce63b326f4ca0ed9a9782
  true_defect: true
  case_defect: false
  reason: types.py:1884-1891 and 1928-1935 are byte-for-byte identical __hash__/__eq__
    bodies, and both classes derive from _SecretField (1763), so the duplication claim
    is accurate. It notes but does not report the non-ASCII TypeError defect.
  recorded_at: '2026-08-26T19:24:35Z'
