note: |
  fix subject: fix(pr/checkout): pass -- before worktree path so dash paths work

  Assessment (agent proposal, not a confirmation): `git worktree add <path>` treats a `path`
  starting with `-` as an option, so a `--worktree` value like `-foo` failed with an
  unknown-switch error because no `--` end-of-options separator preceded it in any of the four
  `worktree add` call sites. introducing_sha (b130a9be, "Add --worktree flag to gh pr checkout")
  is the PR that first added the `--worktree` flag and every one of those call sites -- very
  high confidence, the bug was present from the feature's first commit, not introduced later.
  diff_visible: true -- plausible for a reviewer familiar with this specific git quirk to catch,
  though it is a narrow one to know in advance.
