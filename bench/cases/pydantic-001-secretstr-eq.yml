note: |
  fix subject: Fix `SecretStr` equality comparison raising `TypeError` on non-ASCII values (#13537)

  Assessment (agent proposal, not a confirmation): the introducing commit added
  `SecretStr.__eq__` using `secrets.compare_digest(str, str)` directly. `compare_digest`
  requires bytes or ASCII-only str and raises `TypeError` on anything else, so comparing two
  `SecretStr` values holding non-ASCII text (accented characters etc.) crashed. High confidence
  this is a real, single-line, unambiguous defect and that the introducing commit is correct --
  the line the fix touches is exactly the line that commit added, nothing upstream to
  disambiguate. diff_visible: true -- `compare_digest`'s ASCII-only requirement is a documented
  gotcha a reviewer could plausibly catch on read, without runtime context.
