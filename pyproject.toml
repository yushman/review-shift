[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-shift"
version = "0.1.0"
description = "Nightly autonomous code review of local git branches through Claude Code"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.19",
]

[project.scripts]
review-shift = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.prompts", "src.config"]
package-dir = { "" = "." }

[tool.setuptools.package-data]
"src.prompts" = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
