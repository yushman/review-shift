[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-shift"
version = "0.1.2"
description = "Nightly autonomous code review of local git branches through Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "yush_man" },
]
keywords = ["code-review", "git", "claude-code", "cli", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.19",
]

[project.urls]
Homepage = "https://github.com/yushman/review-shift"
Repository = "https://github.com/yushman/review-shift"
Issues = "https://github.com/yushman/review-shift/issues"

[project.scripts]
review-shift = "review_shift.cli:main"

[tool.setuptools]
packages = ["review_shift", "review_shift.prompts", "review_shift.config"]
package-dir = { "" = "." }

[tool.setuptools.package-data]
"review_shift" = [
    "templates/*.plist",
    "templates/*.yml",
    "schemas/*.json",
    "plugin/.claude-plugin/*.json",
    "plugin/skills/review-shift/*.md",
]
"review_shift.prompts" = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["review_shift", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
